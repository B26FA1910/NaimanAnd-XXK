    '<div class="field"><label for="cf-first" class="req">Нэр</label><input type="text" id="cf-first" value="'+esc(v.firstName||'')+'"></div></div>'+
    '<div class="field"><label for="cf-reg">Регистрийн дугаар</label><input type="text" id="cf-reg" value="'+esc(v.regNo||'')+'" placeholder="УБ00000000" autocapitalize="characters"></div>'+
    '<div class="grid2"><div class="field"><label for="cf-phone" class="req">Утас</label><input type="tel" id="cf-phone" value="'+esc(v.phone||'')+'"><span class="hint">Хугацаа хэтэрвэл SMS сануулга энэ дугаар руу очно</span></div>'+
    '<div class="field"><label for="cf-phone2">Нэмэлт утас</label><input type="tel" id="cf-phone2" value="'+esc(v.phone2||'')+'" placeholder="Гэр бүлийн гишүүний утас"></div></div>'+
    '<div class="field"><label for="cf-addr">Хаяг</label><input type="text" id="cf-addr" value="'+esc(v.address||'')+'"></div>'+
    '<div class="field"><label for="cf-note">Тэмдэглэл</label><textarea id="cf-note" rows="2">'+esc(v.note||'')+'</textarea></div>'+
  '</form>';
  const m = openModal({ title: c ? 'Харилцагчийн мэдээлэл засах' : 'Шинэ харилцагч', body,
    foot:'<button class="btn" data-dismiss>Болих</button><button class="btn btn-primary" type="submit" form="cust-form">'+(c?'Хадгалах':'Бүртгэх')+'</button>' });
  const f = m.el;
  $('#cust-form',f).addEventListener('submit', e=>{
    e.preventDefault();
    const first=$('#cf-first',f).value.trim(), phone=$('#cf-phone',f).value.trim(), reg=$('#cf-reg',f).value.trim().toUpperCase().replace(/\s+/g,'');
    if(!first) return fieldErr($('#cf-first',f),'Нэрийг бичнэ үү');
    if(!phone) return fieldErr($('#cf-phone',f),'Утасны дугаарыг бичнэ үү');
    if(reg){ const dup=db.customers.find(x=>x.regNo===reg && (!c || x.id!==c.id)); if(dup) return fieldErr($('#cf-reg',f),'Энэ РД-тэй харилцагч бүртгэлтэй байна: '+fullName(dup)); }
    const data = { lastName:$('#cf-last',f).value.trim(), firstName:first, regNo:reg, phone, phone2:$('#cf-phone2',f).value.trim(), address:$('#cf-addr',f).value.trim(), note:$('#cf-note',f).value.trim() };
    let saved;
    if(c){ Object.assign(c,data); saved=c; }
    else { saved = Object.assign({id:uid(), createdAt:new Date().toISOString()}, data); db.customers.push(saved); }
    closeModal(m); changed();
    toast(c ? 'Харилцагчийн мэдээллийг хадгаллаа' : fullName(saved)+' бүртгэгдлээ');
    if(opts.onSaved) opts.onSaved(saved);
  });
}
function customerDetail(id){
  const c = custById(id); if(!c) return null;
  const T = todayISO();
  const rows = db.loans.filter(l=>l.customerId===id).map(l=>({l, x:calc(l,T)}))
    .sort((a,b)=>(a.l.status==='active'?0:1)-(b.l.status==='active'?0:1) || b.l.startDate.localeCompare(a.l.startDate));
  const act = rows.filter(r=>r.l.status==='active'), owed = act.reduce((s,r)=>s+r.x.owed,0);
  const figs = [
    ['Регистр', esc(c.regNo||'—')], ['Утас', esc(c.phone||'—')], ['Нэмэлт утас', esc(c.phone2||'—')],
    ['Идэвхтэй зээл', act.length+' <small>/ нийт '+rows.length+'</small>'], ['Одоогийн нийт өр', money(owed)], ['Бүртгэсэн', c.createdAt?fmtDate(c.createdAt.slice(0,10)):'—']
  ];
  let h = '<dl class="figs">'+figs.map(f=>'<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>').join('')+'</dl>';
  if(c.address) h += '<p style="margin:-10px 0 16px"><span class="muted">Хаяг: </span>'+esc(c.address)+'</p>';
  if(c.note) h += '<div class="note-box">'+esc(c.note)+'</div>';
  h += '<div class="actions" style="margin-top:0"><button class="btn btn-primary" data-act="new-loan" data-cust="'+c.id+'">'+ic('plus')+'Шинэ зээл бичих</button>'+
    '<button class="btn" data-act="edit-customer" data-id="'+c.id+'">'+ic('edit')+'Засах</button>'+
    '<button class="btn btn-ghost danger" data-act="del-customer" data-id="'+c.id+'">'+ic('trash')+'Устгах</button></div>';
  h += '<h3 class="mini-title">Зээлийн түүх</h3>';
  if(rows.length){
    h += '<div class="panel">'+rows.map((r,i)=>'<button class="mrow" data-act="open-loan" data-id="'+r.l.id+'"'+(i===0?' style="border-top:0"':'')+'>'+
      '<span class="tno-s">'+tno(r.l)+'</span>'+
      '<span><span class="ell">'+esc(itemLine(r.l))+'</span><span class="cell-sub">'+fmtDate(r.l.startDate)+' олгосон, '+money(r.l.principal)+'</span></span>'+
      '<span class="r num">'+(r.l.status==='active'?'<b>'+money(r.x.owed)+'</b>':'')+'</span>'+badge(r.x.state)+'</button>').join('')+'</div>';
  } else h += '<div class="panel"><div class="empty"><p>Энэ харилцагчид зээл бичигдээгүй байна.</p></div></div>';
  return { title: fullName(c), body:h };
}
function openCustomer(id){
  const d = customerDetail(id); if(!d) return;
  const m = openModal({title:d.title, body:d.body, wide:true, dismissOutside:true});
  m.refresh = ()=>{ const d2=customerDetail(id); if(!d2) return false; m.el.querySelector('.m-head h2').textContent=d2.title; m.el.querySelector('.m-body').innerHTML=d2.body; return true; };
}

/* ================= Хэвлэх ================= */
function printLoan(id){
  const l = loanById(id); if(!l) return;
  const c = custById(l.customerId) || {}, s = db.settings, it = l.item||{};
  const due = dueOf(l);
  const atDue = l.status==='active' ? calc(l, due).owed : calc(l).owed;
  const termInt = Math.round((+l.principal||0)*(+l.rate||0)/100/30*(+l.termDays||0));
  const row = (k,v,full)=>'<div'+(full?' class="full"':'')+'><span>'+k+'</span><b>'+v+'</b></div>';
  const copy = label=>'<div class="pt">'+
    '<div class="pt-head"><div><strong>'+esc(s.shopName)+'</strong><span>'+esc([s.address,s.phone].filter(Boolean).join(', '))+'</span></div><div class="pt-no"><small>Барьцааны тасалбар</small>'+tno(l)+'</div></div>'+
    '<div class="pt-grid">'+
      row('Зээлдэгч', esc(fullName(c)))+row('Регистр', esc(c.regNo||''))+
      row('Утас', esc([c.phone,c.phone2].filter(Boolean).join(', ')))+row('Олгосон огноо', fmtDate(l.startDate))+
      row('Барьцаа', esc(catOf(it.category).name+': '+itemLine(l))+(it.serial?', '+esc(it.serial):''), true)+
      row('Үнэлгээ', it.est?money(it.est):'')+row('Зээлийн дүн', money(l.principal))+
      row('Сарын хүү', fmtRate(l.rate)+'%')+row('Хугацаа', l.termDays+' хоног')+
      row('Хугацааны хүү', money(termInt))+row('Дуусах огноо', fmtDate(due))+
      row('Дуусах өдөр төлөх нийт дүн', money(atDue), true)+
    '</div>'+
    (s.terms?'<p class="pt-terms">'+esc(s.terms)+'</p>':'')+
    '<div class="pt-sign"><span>Зээлдэгч: ____________________</span><span>Ажилтан: ____________________</span></div>'+
    '<div class="pt-copy">'+label+'</div></div>';
  $('#print-area').innerHTML = copy('Харилцагчийн хувь') + '<div class="pt-cut"><span>энд хайчилна</span></div>' + copy('Ломбардын хувь');
  try{ window.print(); }catch(e){ toast('Хэвлэх боломжгүй байна','err'); }
}

/* ================= Нөөц, экспорт ================= */
function exportJSON(){
  const T = todayISO();
  db.settings.lastBackup = new Date().toISOString();
  const ok = download('lombard-nuots-'+T+'.json', JSON.stringify(db,null,2), 'application/json');
  if(ok){ save(); render(); refreshModals(); toast('Нөөц файл татагдлаа'); }
}
function exportCSV(){
  const T=todayISO();
  const head=['Тасалбар','Төлөв','Харилцагч','РД','Утас','Барьцааны төрөл','Барьцаа','Сериал','Үнэлгээ','Зээлийн дүн','Сарын хүү %','Олгосон','Дуусах','Хаагдсан','Үндсэн үлдэгдэл','Хуримтлагдсан хүү','Нийт өр','Төлсөн хүү','Нийт төлсөн'];
  const q = v=>{ v=String(v==null?'':v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const lines=[head.map(q).join(',')];
  db.loans.slice().sort((a,b)=>a.ticketNo-b.ticketNo).forEach(l=>{
    const c=custById(l.customerId)||{}, x=calc(l,T), it=l.item||{};
    lines.push([tno(l), STATE[x.state][0], fullName(c), c.regNo, c.phone, catOf(it.category).name, itemLine(l), it.serial, it.est||'', l.principal, l.rate, l.startDate, x.due, l.closedDate||'', x.bal, x.acc, x.owed, x.intPaid, x.paid].map(q).join(','));
  });
  if(download('lombard-zeel-'+T+'.csv', '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8')) toast('Жагсаалт татагдлаа');
}
$('#import-file').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0]; e.target.value='';
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let data;
    try{ data = JSON.parse(rd.result); }catch(err){ toast('Файл уншигдсангүй. Энэ хуудаснаас татсан .json нөөц файл сонгоно уу.','err',5000); return; }
    if(!data || !Array.isArray(data.loans) || !Array.isArray(data.customers)){ toast('Энэ файл ломбардын нөөц биш байна','err',5000); return; }
    confirmBox({ title:'Нөөцөөс сэргээх үү?', danger:true, ok:'Сэргээх',
      text:'Файлд '+data.customers.length+' харилцагч, '+data.loans.length+' зээл байна. Сервер дээрх одоогийн бүх бүртгэл ('+db.customers.length+' харилцагч, '+db.loans.length+' зээл) файлынхаар солигдож, бүх төхөөрөмжид шинэчлэгдэнэ.',
      onOk: async ()=>{ try{ await runImport(data); toast('Нөөцөөс сэргээлээ'); }catch(err){ handleApiError(err,false); toast('Сэргээж чадсангүй. Дахин оролдоно уу.','err',5000); } } });
  };
  rd.onerror = ()=>toast('Файл уншигдсангүй','err');
  rd.readAsText(file);
});

/* ================= Жишээ өгөгдөл ================= */
function loadDemo(){
  if(db.loans.length || db.customers.length) return;
  const T=todayISO(), D=n=>addDays(T,n);
  const ppl=[['Батсүх','Энхжин','УП95031512','9911 2233','СХД, 32-р хороо'],['Дорж','Тэмүүлэн','ЧЕ88120433','8805 4471','БЗД, 14-р хороо'],['Цэрэндорж','Номин','УЗ01250718','9518 0062','ХУД, 3-р хороо'],['Ганбаатар','Мөнх-Эрдэнэ','ИЮ92070921','9907 3315','СБД, 8-р хороо'],['Отгонбаяр','Сарангэрэл','ФА85111206','8611 9024','ЧД, 5-р хороо'],['Пүрэвдорж','Билгүүн','УЕ99041530','9440 2718','БГД, 20-р хороо']];
  const cs = ppl.map((p,i)=>({id:uid()+i, lastName:p[0], firstName:p[1], regNo:p[2], phone:p[3], phone2:'', address:p[4], note:'', createdAt:new Date(toUTC(D(-90+i*5))).toISOString()}));
  db.customers = cs;
  let no = 1;
  const mk = (ci, cat, name, extra, est, P, R, start, term)=>{
    const l = { id:uid()+no, ticketNo:no++, customerId:cs[ci].id, item:Object.assign({category:cat, name, serial:'', weight:'', purity:'', est}, extra||{}),
      principal:P, rate:R, termDays:term, startDate:D(start), status:'active', closedDate:null, note:'', createdAt:new Date().toISOString(),
      events:[{id:uid(), type:'issue', date:D(start), at:stamp()}] };
    db.loans.push(l); return l;
  };
  let l;
  l = mk(4,'watch','Apple Watch Series 8',{serial:'GX7QK2'},700000,350000,4,-80,30); opClose(l,D(-40),'forfeit','Харилцагч утсаа авахгүй байна');
  l = mk(5,'electronics','Samsung 55" QLED зурагт',{},900000,450000,4.5,-50,30); opPay(l,D(-22),calc(l,D(-22)).owed,'Бэлэн'); opClose(l,D(-22),'redeem','');
  l = mk(3,'car','Toyota Prius 30, 2012 он',{serial:'1234 УБА'},18000000,8000000,3,-45,60); opPay(l,D(-15),1000000,'Данс');
  l = mk(4,'gold','Алтан гинж',{weight:'12.5', purity:'750'},3500000,2400000,3,-40,30); opPay(l,D(-10),calc(l,D(-10)).acc,'Сунгалтын хүү'); opExtend(l,D(-10),30,'');
  l = mk(4,'other','Canon EOS 90D камер',{serial:'083021004512'},1600000,800000,4,-38,30); opPay(l,D(-20),200000,'');
  l = mk(0,'gold','Алтан бөгж',{weight:'4.2', purity:'585'},1300000,900000,3.5,-34,30);
  l = mk(1,'gold','Алтан ээмэг',{weight:'3.1', purity:'585'},950000,600000,3.5,-29,30);
  l = mk(1,'phone','iPhone 14 Pro 256GB',{serial:'IMEI 356728114902337'},1800000,1000000,4,-28,30); opPay(l,D(-14),100000,'');
  l = mk(2,'computer','MacBook Air M2 13"',{serial:'C02HX1Q4MD6T'},2600000,1500000,3.5,-10,30);
  l = mk(2,'phone','Samsung Galaxy S23',{serial:'IMEI 351234567890125'},1400000,700000,4,-1,14);
  db.settings.nextTicket = no;
  changed(); toast('Жишээ өгөгдөл ачааллаа. Тохиргоо хэсгээс бүгдийг устгаж болно.',null,4500);
}

/* ================= Товчлуурын үйлдлүүд ================= */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'new-loan': openLoanForm({customerId:b.dataset.cust}); break;
    case 'open-loan': openLoan(id); break;
    case 'new-customer': openCustomerForm({}); break;
    case 'open-customer': openCustomer(id); break;
    case 'edit-customer': openCustomerForm({id}); break;
    case 'del-customer': {
      const c=custById(id), n=db.loans.filter(l=>l.customerId===id).length;
      if(n){ toast('Энэ харилцагчид '+n+' зээл бүртгэлтэй тул устгах боломжгүй','err',4000); break; }
      confirmBox({title:'Харилцагчийг устгах уу?', text:esc(fullName(c))+' харилцагчийн мэдээлэл устна.', ok:'Устгах', danger:true,
        onOk:()=>{ db.customers=db.customers.filter(x=>x.id!==id); changed(); toast('Харилцагчийг устгалаа'); }});
      break; }
    case 'filter': ui.loanF=b.dataset.f; renderLoanList(); break;
    case 'filter-go': ui.loanF=b.dataset.f; break;
    case 'pay': openPayment(id); break;
    case 'extend': openExtend(id); break;
    case 'redeem': openRedeem(id); break;
    case 'forfeit': openForfeit(id); break;
    case 'print': printLoan(id); break;
    case 'edit-loan': openLoanForm({id}); break;
    case 'reopen': {
      const l=loanById(id);
      confirmBox({title:tno(l)+' зээлийг дахин нээх үү?', text:'Зээл идэвхтэй төлөвт буцна. Хаах үед бүртгэсэн төлөлт түүхэнд хэвээр үлдэх тул шаардлагатай бол тусад нь устгана уу.', ok:'Дахин нээх',
        onOk:()=>{ opReopen(l); changed(); toast(tno(l)+' зээлийг дахин нээлээ'); }});
      break; }
    case 'del-loan': {
      const l=loanById(id);
      confirmBox({title:tno(l)+' тасалбарыг устгах уу?', text:'Энэ зээлийн бүх төлөлт, сунгалтын түүх хамт устна. Алдаатай бичсэн тасалбарыг л устгана уу.', ok:'Устгах', danger:true,
        onOk:()=>{ db.loans=db.loans.filter(x=>x.id!==id); changed(); toast(tno(l)+' тасалбарыг устгалаа'); }});
      break; }
    case 'del-event': {
      const l=loanById(id), ev=l&&l.events.find(x=>x.id===b.dataset.ev); if(!ev) break;
      confirmBox({title:'Бичлэгийг устгах уу?', text:(ev.type==='payment'?'Төлөлт '+money(ev.amount):'Сунгалт')+' ('+fmtDate(ev.date)+') устаж, үлдэгдэл дахин бодогдоно.', ok:'Устгах', danger:true,
        onOk:()=>{ l.events=l.events.filter(x=>x.id!==ev.id); changed(); toast('Бичлэгийг устгалаа'); }});
      break; }
    case 'demo': loadDemo(); break;
    case 'backup': exportJSON(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#import-file').click(); break;
    case 'wipe':
      confirmBox({title:'Бүх өгөгдлийг устгах уу?', text:'Харилцагч, зээл, төлөлтийн бүх бүртгэл устна. Үүнийг буцаах боломжгүй.', ok:'Бүгдийг устгах', danger:true, typed:'УСТГАХ',
        onOk: async ()=>{
          syncing = true;
          try{ await api('/api/wipe', {method:'POST'}); applyServer(await api('/api/data')); syncing = false; render(); setSync('ok'); toast('Бүх бүртгэл устлаа'); }
          catch(err){ syncing = false; handleApiError(err,false); toast('Устгаж чадсангүй. Дахин оролдоно уу.','err'); }
        }});
      break;
    case 'logout': logout(); break;
    case 'retry-sync': pushSync(); break;
    case 'sms-test': smsTest(b); break;
    case 'sms-run': smsRun(b); break;
  }
});

render();
boot();
})();
