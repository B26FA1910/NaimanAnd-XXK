/* ================= Зээлийн дэлгэрэнгүй ================= */
function loanDetail(id){
  const l = loanById(id); if(!l) return null;
  const c = custById(l.customerId), T = todayISO(), x = calc(l,T), act = l.status==='active';
  const items = l.items||[], est = estTotal(l);
  let owedLabel, owedVal;
  if(act){ owedLabel='Өнөөдөр хаахад төлөх'; owedVal=x.owed; }
  else if(l.status==='redeemed'){ owedLabel='Нийт төлсөн'; owedVal=x.paid; }
  else { owedLabel='Хураах үеийн өр'; owedVal=x.owed; }
  const bl = c && blacklistHit(c.regNo);
  let h = (bl ? '<div class="bl-warn" style="margin-bottom:14px"><b>Хар жагсаалтад бүртгэлтэй харилцагч:</b> '+esc(bl.category)+(bl.note?'. '+esc(bl.note):'')+'</div>' : '')+
    '<div class="ticket big st-'+x.state+'">'+
    '<div class="stub"><span class="tno">'+tno(l)+'</span><span class="stub-due">'+(act?'Дуусах':'Хаагдсан')+'<b>'+fmtDate(act?x.due:l.closedDate)+'</b></span></div>'+
    '<div class="tbody">'+
      '<div class="t-top"><div class="who">'+(c?'<button class="link" data-act="open-customer" data-id="'+c.id+'">'+esc(fullName(c))+'</button>':'<b>Устгагдсан харилцагч</b>')+(c&&c.phone?'<span>'+esc(c.phone)+'</span>':'')+(c&&c.regNo?'<span>РД '+esc(c.regNo)+'</span>':'')+'</div>'+badge(x.state)+'</div>'+
      '<div class="what">'+(items.length ? items.map(i=>'<div><span class="cb">'+esc(catOf(i.category).name)+'</span> <b>'+esc(itemText(i))+'</b>'+(i.serial?' <span class="muted">'+esc(i.serial)+'</span>':'')+(i.est&&items.length>1?' <span class="muted">'+money(i.est)+'</span>':'')+'</div>').join('') : '<span class="muted">Барьцаа бүртгэгдээгүй</span>')+'</div>'+
      '<div class="owed-line"><span>'+owedLabel+'</span><b>'+money(owedVal)+'</b></div>'+
    '</div></div>';
  if(act){
    h += '<div class="actions"><button class="btn btn-primary" data-act="pay" data-id="'+l.id+'">'+ic('cash')+'Төлөлт бүртгэх</button>'+
      '<button class="btn" data-act="extend" data-id="'+l.id+'">'+ic('clock')+'Хугацаа сунгах</button>'+
      '<button class="btn" data-act="redeem" data-id="'+l.id+'">'+ic('check')+'Төлж хаах</button></div>';
  }
  h += '<div class="actions-2"><button class="btn btn-ghost sm" data-act="print" data-id="'+l.id+'">'+ic('print')+'Тасалбар хэвлэх</button>'+
    '<button class="btn btn-ghost sm" data-act="edit-loan" data-id="'+l.id+'">'+ic('edit')+'Засах</button>'+
    (act?'<button class="btn btn-ghost sm" data-act="forfeit" data-id="'+l.id+'">'+ic('lock')+'Барьцаа хураах</button>':'<button class="btn btn-ghost sm" data-act="reopen" data-id="'+l.id+'">'+ic('undo')+'Дахин нээх</button>')+
    (isAdmin()?'<button class="btn btn-ghost sm danger" data-act="del-loan" data-id="'+l.id+'">'+ic('trash')+'Устгах</button>':'')+'</div>';

  h += '<div class="pgs"><div><div class="pg-head"><span>Хугацааны явц</span><b class="'+(late(x)?'red':'')+'">'+esc(dueText(x))+'</b></div>'+
      '<span class="track st-'+x.state+'"><i style="width:'+(x.timePct*100).toFixed(1)+'%"></i></span>'+
      '<div class="pg-scale"><span>'+fmtDate(l.startDate)+' олгосон</span><span>'+(act?(Math.max(0,x.elapsed))+' / '+x.term+' хоног':x.elapsed+' хоног')+'</span><span>'+fmtDate(x.due)+' дуусах</span></div></div>'+
    '<div><div class="pg-head"><span>Үндсэн зээлийн төлөлт</span><b>'+Math.round(x.payPct*100)+'%</b></div>'+
      '<span class="track pay"><i style="width:'+(x.payPct*100).toFixed(1)+'%"></i></span>'+
      '<div class="pg-scale"><span>'+money(x.prinPaid)+' төлсөн</span><span>'+money(l.principal)+'</span></div></div></div>';

  const ext = l.events.filter(e=>e.type==='extend');
  const figs = [
    ['Зээлийн дүн', money(l.principal)+' <small>('+ACC[l.method||'cash'].toLowerCase()+')</small>'],
    ['Барьцааны үнэлгээ', est?money(est)+(l.principal?' <small>('+Math.round(l.principal/est*100)+'%)</small>':''):'—'],
    ['Хүү', 'Сарын '+fmtRate(l.rate)+'% <small>(хоногт '+money((+l.principal||0)*(+l.rate||0)/100/30)+')</small>'],
    ['Үндсэн зээлийн үлдэгдэл', money(x.bal)],
    [act?'Хуримтлагдсан хүү':'Хаах үеийн хүү', money(x.acc)],
    ['Төлсөн хүү', money(x.intPaid)],
    ['Нийт төлсөн', money(x.paid)+(x.over?' <small>(илүү '+money(x.over)+')</small>':'')],
    ['Хугацаа', l.termDays+' хоног'+(ext.length?' <small>(+'+ext.reduce((s,e)=>s+(+e.days||0),0)+' хоног, '+ext.length+' сунгалт)</small>':'')],
    ['Бичсэн ажилтан', esc(userName(l.by)||'—')]
  ];
  h += '<dl class="figs">'+figs.map(f=>'<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>').join('')+'</dl>';
  if(l.note) h += '<div class="note-box">'+esc(l.note)+'</div>';

  h += '<h3>Түүх</h3><ol class="tl">';
  const smsEv = smsInfo.log.filter(r=>r.loan_id===l.id && r.status!=='test').map(r=>({id:'sms'+r.created_at, type:'sms', date:ubDate(r.created_at), at:r.created_at*1000, sms:r}));
  for(const e of sortEvents(l.events.concat(smsEv))){
    let t='', s='';
    const by = e.type==='issue' ? (e.by||l.by) : e.by;
    if(e.type==='issue'){ t='Зээл олгосон '+money(l.principal); s='Сарын '+fmtRate(l.rate)+'% хүүтэй, '+l.termDays+' хоногийн хугацаатай, '+ACC[l.method||'cash'].toLowerCase()+'ээр'; }
    else if(e.type==='payment'){ t='Төлөлт '+money(e.amount)+' ('+ACC[e.method||'cash'].toLowerCase()+')'; const a=x.alloc[e.id]; if(a){ const p=[]; if(a.i) p.push('хүүнд '+money(a.i)); if(a.p) p.push('үндсэн зээлд '+money(a.p)); if(a.o) p.push('илүү төлөлт '+money(a.o)); s=p.join(', '); } }
    else if(e.type==='extend'){ t='Хугацаа '+(e.req||e.days)+' хоногоор сунгасан'; s='Шинэ дуусах огноо '+fmtDate(e.newDue||''); }
    else if(e.type==='redeem'){ t='Төлж хаасан, барьцааг буцаан олгосон'; if(e.remaining>0) s='Хөнгөлөлт '+money(e.remaining); }
    else if(e.type==='forfeit'){ t='Барьцааг хураасан'; if(e.remaining>0) s='Хураах үеийн өр '+money(e.remaining); }
    else if(e.type==='sms'){ const r=e.sms; t = r.status==='sent'?'SMS сануулга илгээсэн':r.status==='skipped'?'SMS илгээгээгүй':'SMS илгээж чадсангүй'; s = r.status==='sent' ? (r.phone+' дугаар руу, '+fmtStamp(r.created_at).slice(11)+' цагт') : (r.info||''); }
    const del = act && (e.type==='payment'||e.type==='extend') ? '<button class="icon-btn sm" data-act="del-event" data-id="'+l.id+'" data-ev="'+e.id+'" aria-label="Энэ бичлэгийг устгах" title="Устгах">'+ic('trash')+'</button>' : '<span></span>';
    h += '<li class="ev-'+e.type+'"><span class="d">'+fmtDate(e.date)+'</span><span class="dot"></span><span class="what"><b>'+esc(t)+'</b>'+(s?'<span>'+esc(s)+'</span>':'')+(e.note?'<span class="note">'+esc(e.note)+'</span>':'')+(by?'<span>Ажилтан: '+esc(userName(by))+'</span>':'')+'</span>'+del+'</li>';
  }
  if(act){
    const future = x.due > T ? calc(l, x.due).owed : null;
    h += '<li class="ev-pending '+x.state+'"><span class="d">'+fmtDate(x.due)+'</span><span class="dot"></span><span class="what"><b>Дуусах хугацаа</b><span>'+esc(dueText(x))+(future!==null?'. Тэр өдөр хаахад '+money(future):'')+'</span></span><span></span></li>';
  }
  h += '</ol>';
  return { title: tno(l)+' тасалбар', body:h };
}
function openLoan(id){
  const d = loanDetail(id); if(!d) return;
  const m = openModal({title:d.title, body:d.body, wide:true, dismissOutside:true});
  m.refresh = ()=>{ const d2=loanDetail(id); if(!d2) return false; m.el.querySelector('.m-head h2').textContent=d2.title; m.el.querySelector('.m-body').innerHTML=d2.body; return true; };
}

/* ================= Зээлийн маягт ================= */
function openLoanForm(opts){
  opts = opts || {};
  const editing = opts.id ? loanById(opts.id) : null, s = db.settings;
  const l = editing || { customerId:opts.customerId||'', items:[], principal:0, rate:s.defaultRate, termDays:s.defaultTerm, startDate:todayISO(), note:'', method:'cash' };
  const firstCat = (cats()[0]||{}).id || 'other';
  let items = ((l.items&&l.items.length) ? l.items : [{id:uid(), category:firstCat, name:'', serial:'', est:0}]).map(i=>Object.assign({}, i));
  const hasPays = editing && editing.events.some(e=>e.type==='payment');
  const body = '<form id="loan-form" class="form" novalidate>'+
    '<div class="fs-title">Харилцагч</div>'+
    '<div class="field"><label for="lf-reg" class="req">Регистрийн дугаар</label>'+
      '<input type="text" id="lf-reg" placeholder="УБ99112233" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="16" value="'+esc((custById(l.customerId)||{}).regNo||'')+'">'+
      '<span class="hint" id="lf-reg-hint"></span></div>'+
    '<div id="lf-cm" aria-live="polite"></div>'+
    '<div id="lf-nc" class="nc" hidden>'+
      '<div class="nc-t">'+ic('plus')+'Шинэ харилцагч. Зээл бичихэд автоматаар бүртгэгдэнэ.</div>'+
      '<div class="grid2"><div class="field"><label for="lf-last">Овог</label><input type="text" id="lf-last"></div>'+
      '<div class="field"><label for="lf-first" class="req">Нэр</label><input type="text" id="lf-first"></div></div>'+
      '<div class="grid2"><div class="field"><label for="lf-phone" class="req">Утас</label><input type="tel" id="lf-phone"><span class="hint">Хугацаа хэтэрвэл SMS сануулга энэ дугаар руу очно</span></div>'+
      '<div class="field"><label for="lf-phone2">Нэмэлт утас</label><input type="tel" id="lf-phone2" placeholder="Гэр бүлийн гишүүний утас"></div></div>'+
      '<div class="field"><label for="lf-addr">Хаяг</label><input type="text" id="lf-addr"></div>'+
    '</div>'+
    '<div id="lf-bl"></div>'+
    '<div class="fs-title">Барьцаа хөрөнгө</div>'+
    '<div class="items-ed" id="lf-items"></div>'+
    '<div><button type="button" class="btn btn-ghost sm" id="lf-additem" style="margin-left:-10px">'+ic('plus')+'Барьцаа нэмэх</button></div>'+
    '<div class="fs-title">Зээл</div>'+
    (hasPays?'<p class="hint">Энэ зээлд төлөлт бүртгэгдсэн тул дүн, хүүг өөрчлөхөд үлдэгдэл дахин бодогдоно.</p>':'')+
    '<div class="grid2"><div class="field"><label for="lf-amt" class="req">Зээлийн дүн, ₮</label><input type="text" inputmode="numeric" class="money" id="lf-amt" value="'+(l.principal?num(l.principal):'')+'" placeholder="0"></div>'+
      '<div class="field"><label for="lf-rate" class="req">Сарын хүү, %</label><input type="number" id="lf-rate" step="0.1" min="0" value="'+esc(l.rate)+'"></div></div>'+
    '<div class="grid2"><div class="field"><label for="lf-term" class="req">Хугацаа, хоног</label><input type="number" id="lf-term" step="1" min="1" value="'+esc(l.termDays)+'">'+
      '<div class="quick">'+[7,14,30,60,90].map(n=>'<button type="button" data-term="'+n+'">'+n+' хоног</button>').join('')+'</div></div>'+
      '<div class="field"><label for="lf-start" class="req">Олгосон огноо</label><input type="date" id="lf-start" value="'+esc(l.startDate)+'"></div></div>'+
    '<div class="grid2"><div class="field"><label for="lf-method">Олгосон хэлбэр</label><select id="lf-method"><option value="cash"'+(l.method!=='bank'?' selected':'')+'>Бэлэн</option><option value="bank"'+(l.method==='bank'?' selected':'')+'>Данс</option></select></div><div></div></div>'+
    '<div class="calc" id="lf-calc"></div>'+
    '<div class="field"><label for="lf-note">Тэмдэглэл</label><textarea id="lf-note" rows="2" placeholder="Барьцааны байдал, дагалдах зүйл гэх мэт">'+esc(l.note||'')+'</textarea></div>'+
  '</form>';
  const m = openModal({ title: editing ? tno(editing)+' тасалбарыг засах' : 'Шинэ зээл бичих', body, wide:true,
    foot:'<button class="btn" data-dismiss>Болих</button><button class="btn btn-primary" type="submit" form="loan-form">'+(editing?'Өөрчлөлтийг хадгалах':'Зээл бичих')+'</button>' });
  const f = m.el;
  bindMoney(f);
  const regIn=$('#lf-reg',f), regHint=$('#lf-reg-hint',f), cmBox=$('#lf-cm',f), ncBox=$('#lf-nc',f), itemsBox=$('#lf-items',f);
  // Регистрээр харилцагч олно. Бүртгэлтэй бол "Энэ хүн мөн үү?" гэж асууна, бүртгэлгүй бол шинэ харилцагчийн талбарууд гарна.
  let picked = custById(l.customerId) ? l.customerId : '';
  const REG_HINT = 'Бүртгэлтэй харилцагч бол мэдээлэл нь автоматаар гарч ирнэ';
  function custCard(c, ask){
    const ls = db.loans.filter(x=>x.customerId===c.id), act = ls.filter(x=>x.status==='active');
    const owed = act.reduce((t,x)=>t+calc(x).owed,0), lateN = act.filter(x=>['overdue','bad'].includes(calc(x).state)).length;
    const info = '<div class="cm-i"><b>'+esc(fullName(c))+'</b><span>'+esc([c.regNo, c.phone, c.phone2].filter(Boolean).join(' · '))+'</span>'+
      '<span>'+(ls.length ? 'Нийт '+ls.length+' зээл'+(act.length ? ', идэвхтэй '+act.length+', өр '+money(owed) : ', бүгд хаагдсан') : 'Өмнө зээл аваагүй')+
      (lateN ? ', <em class="neg">хугацаа хэтэрсэн '+lateN+'</em>' : '')+'</span>'+(c.address?'<span>'+esc(c.address)+'</span>':'')+'</div>';
    return ask
      ? '<div class="cmatch ask"><div class="cm-q">Энэ хүн мөн үү?</div>'+info+'<div class="cm-b"><button type="button" class="btn btn-primary sm" data-cm="yes">Тийм, мөн</button><button type="button" class="btn sm" data-cm="no">Үгүй</button></div></div>'
      : '<div class="cmatch ok"><span class="cm-ic">'+ic('check')+'</span>'+info+'<button type="button" class="btn btn-ghost sm" data-cm="change">Солих</button></div>';
  }
  function regUpd(msg){
    const reg = normReg(regIn.value), pc = custById(picked);
    if(pc && normReg(pc.regNo)!==reg) picked = '';
    let hint = msg || REG_HINT, bad = !!msg, cm = '', isNew = false;
    if(picked) cm = custCard(custById(picked), false);
    else if(reg){
      const hit = custByReg(reg), err = regError(reg);
      if(hit) cm = custCard(hit, true);
      else if(!err){ isNew = true; hint = 'Энэ регистртэй харилцагч бүртгэлгүй байна. Доорх мэдээллийг бөглөнө үү.'; bad = false; }
      else {
        const sug = reg.length>=2 ? db.customers.filter(c=>normReg(c.regNo).startsWith(reg)).slice(0,5) : [];
        if(sug.length) cm = '<div class="cm-sug"><span class="lbl">Бүртгэлтэй харилцагчид</span>'+sug.map(c=>'<button type="button" data-pick="'+c.id+'"><b>'+esc(c.regNo)+'</b>'+esc(fullName(c))+'<span>'+esc(c.phone||'')+'</span></button>').join('')+'</div>';
        if(reg.length>=10 || /[A-Z]/.test(reg)){ hint = err; bad = true; }
      }
    }
    regHint.textContent = hint; regHint.classList.toggle('neg', bad);
    cmBox.innerHTML = cm; ncBox.hidden = !isNew;
    blCheck();
  }
  function choose(id){ picked = id; const c = custById(id); if(c && c.regNo) regIn.value = c.regNo; regIn.classList.remove('bad'); regUpd(); setTimeout(()=>{ const n=$('.iname',itemsBox); n && !n.value && n.focus(); }, 20); }
  function blCheck(){
    const c = custById(picked), hit = blacklistHit(regIn.value) || (c && blacklistHit(c.regNo));
    $('#lf-bl',f).innerHTML = hit ? '<div class="bl-warn"><b>Анхаар: энэ харилцагч хар жагсаалтад бүртгэлтэй.</b> '+esc(hit.category)+(hit.note?'. '+esc(hit.note):'')+'</div>' : '';
    return hit;
  }
  function readItems(){
    $$('.irow',itemsBox).forEach((row,i)=>{
      const it = items[i]; if(!it) return;
      it.category = $('.icat',row).value; it.name = $('.iname',row).value; it.est = parseMoney($('.iest',row).value); it.serial = $('.iserial',row).value;
      const w=$('.iweight',row), p=$('.ipurity',row); it.weight = w ? w.value : (it.weight||''); it.purity = p ? p.value : (it.purity||'');
    });
  }
  function renderItems(){
    itemsBox.innerHTML = items.map((it,i)=>{
      const metal = !!catOf(it.category).metal;
      const known = cats().some(c=>c.id===it.category);
      return '<div class="irow">'+
        '<select class="icat" aria-label="Барьцааны ангилал">'+cats().map(c=>'<option value="'+esc(c.id)+'"'+(c.id===it.category?' selected':'')+'>'+esc(c.name)+'</option>').join('')+(known?'':'<option value="'+esc(it.category)+'" selected>'+esc(catOf(it.category).name)+'</option>')+'</select>'+
        '<input type="text" class="iname" placeholder="Нэр, тодорхойлолт. Жишээ нь: iPhone 14 Pro" value="'+esc(it.name||'')+'" aria-label="Барьцааны нэр">'+
        '<input type="text" inputmode="numeric" class="money iest" placeholder="Үнэлгээ, ₮" value="'+(it.est?num(it.est):'')+'" aria-label="Үнэлгээ">'+
        '<button type="button" class="icon-btn sm" data-rm="'+i+'" aria-label="Энэ барьцааг хасах" title="Хасах"'+(items.length<2?' disabled':'')+'>'+ic('x')+'</button>'+
        '<div class="ext'+(metal?'':' nometal')+'"><input type="text" class="iserial" placeholder="Сериал, IMEI, улсын дугаар" value="'+esc(it.serial||'')+'" aria-label="Сериал">'+
        (metal?'<input type="text" inputmode="decimal" class="iweight" placeholder="Жин, гр" value="'+esc(it.weight||'')+'" aria-label="Жин, грамм"><input type="text" class="ipurity" placeholder="Сорьц" value="'+esc(it.purity||'')+'" aria-label="Сорьц">':'')+
        '</div></div>';
    }).join('');
    bindMoney(itemsBox);
    $$('.icat',itemsBox).forEach(x=>x.addEventListener('change',()=>{ readItems(); renderItems(); upd(); }));
    $$('.iest',itemsBox).forEach(x=>x.addEventListener('input',upd));
    $$('[data-rm]',itemsBox).forEach(b=>b.addEventListener('click',()=>{ readItems(); items.splice(+b.dataset.rm,1); renderItems(); upd(); }));
  }
  regUpd();
  regIn.addEventListener('input', ()=>regUpd());
  regIn.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    e.preventDefault();
    const yes = $('[data-cm="yes"]',cmBox), one = $$('[data-pick]',cmBox);
    if(yes) yes.click(); else if(one.length===1) one[0].click(); else if(!ncBox.hidden) $('#lf-first',f).focus();
  });
  cmBox.addEventListener('click', e=>{
    const b = e.target.closest('[data-cm],[data-pick]'); if(!b) return;
    if(b.dataset.pick) return choose(b.dataset.pick);
    if(b.dataset.cm==='yes'){ const c = custByReg(regIn.value); if(c) choose(c.id); return; }
    picked = ''; regIn.value = ''; regIn.focus();
    regUpd(b.dataset.cm==='no' ? 'Нэг регистр нэг л хүнийх байдаг. Регистрийг шалгаад дахин бичнэ үү.' : '');
  });
  $('#lf-additem',f).addEventListener('click', ()=>{
    readItems();
    items.push({id:uid(), category:(items[items.length-1]||{}).category||firstCat, name:'', serial:'', est:0});
    renderItems(); upd();
    setTimeout(()=>{ const n=$$('.iname',itemsBox); n[n.length-1].focus(); }, 20);
  });
  $$('[data-term]',f).forEach(b=>b.addEventListener('click', ()=>{ $('#lf-term',f).value=b.dataset.term; upd(); }));
  function upd(){
    const P=parseMoney($('#lf-amt',f).value), R=parseRate($('#lf-rate',f).value)||0, N=parseInt($('#lf-term',f).value,10)||0, S=isISO($('#lf-start',f).value)?$('#lf-start',f).value:todayISO();
    const E=$$('.iest',itemsBox).reduce((s,x)=>s+parseMoney(x.value),0);
    const daily=P*R/100/30, ti=Math.round(daily*N);
    $('#lf-calc',f).innerHTML =
      '<div><span>Дуусах огноо</span><b>'+(N?fmtDate(addDays(S,N)):'—')+'</b></div>'+
      '<div><span>Хоногийн хүү</span><b>'+money(daily)+'</b></div>'+
      '<div><span>Хугацааны хүү</span><b>'+money(ti)+'</b></div>'+
      '<div><span>Нийт үнэлгээ</span><b>'+(E?money(E)+(P?' ('+Math.round(P/E*100)+'%)':''):'—')+'</b></div>'+
      '<div class="total"><span>Хугацаандаа төлөх нийт дүн</span><b>'+money(P+ti)+'</b></div>';
  }
  renderItems();
  ['lf-amt','lf-rate','lf-term','lf-start'].forEach(id=>$('#'+id,f).addEventListener('input',upd));
  upd();
  setTimeout(()=>{ (picked ? $('.iname',itemsBox) : regIn).focus(); }, 30);

  $('#loan-form',f).addEventListener('submit', async e=>{
    e.preventDefault();
    if(f.dataset.busy) return;
    readItems();
    let cid=picked, newCust=null;
    const P=parseMoney($('#lf-amt',f).value), R=parseRate($('#lf-rate',f).value), N=parseInt($('#lf-term',f).value,10), S=$('#lf-start',f).value;
    if(!cid){
      const reg = normReg(regIn.value);
      if(custByReg(reg)){ const y=$('[data-cm="yes"]',cmBox); fieldErr(regIn,'Энэ хүн мөн эсэхийг "Тийм, мөн" дарж баталгаажуулна уу'); y && y.focus(); return; }
      const rErr = regError(reg); if(rErr){ regUpd(rErr); return fieldErr(regIn, rErr); }
      const first=$('#lf-first',f).value.trim(), phone=$('#lf-phone',f).value.trim();
      if(!first) return fieldErr($('#lf-first',f),'Харилцагчийн нэрийг бичнэ үү');
      const pErr = phoneError(phone); if(pErr) return fieldErr($('#lf-phone',f), pErr);
      newCust = { id:uid(), createdAt:new Date().toISOString(), by:me?me.username:'', lastName:$('#lf-last',f).value.trim(), firstName:first, regNo:reg,
        phone, phone2:$('#lf-phone2',f).value.trim(), address:$('#lf-addr',f).value.trim(), note:'' };
    }
    const clean = items.filter(i=>(i.name||'').trim() || +i.est).map(i=>{ const metal=!!catOf(i.category).metal; return {id:i.id||uid(), category:i.category, name:(i.name||'').trim(), serial:(i.serial||'').trim(), est:+i.est||0, weight:metal?String(i.weight||'').trim():'', purity:metal?String(i.purity||'').trim():''}; });
    const noName = clean.findIndex(i=>!i.name);
    if(!clean.length || noName>=0){ const rows=$$('.iname',itemsBox); return fieldErr(rows[Math.max(0, noName>=0 ? items.findIndex(i=>!(i.name||'').trim()) : 0)] || rows[0],'Барьцаа хөрөнгийн нэрийг бичнэ үү'); }
    if(!(P>0)) return fieldErr($('#lf-amt',f),'Зээлийн дүнг оруулна уу');
    if(!(R>=0)) return fieldErr($('#lf-rate',f),'Сарын хүүг оруулна уу');
    if(!(N>=1)) return fieldErr($('#lf-term',f),'Хугацааг хоногоор оруулна уу');
    if(!isISO(S)) return fieldErr($('#lf-start',f),'Олгосон огноог оруулна уу');
    const note = $('#lf-note',f).value.trim(), method = $('#lf-method',f).value==='bank' ? 'bank' : 'cash';
    if(!editing && blCheck() && !f.dataset.blOk){
      confirmBox({ title:'Хар жагсаалтад бүртгэлтэй харилцагч', danger:true, ok:'Тийм, зээл бичих',
        text:esc(fullName(newCust||custById(cid)))+' ('+esc(normReg(regIn.value))+') хар жагсаалтад бүртгэлтэй байна. Зээл олгохдоо итгэлтэй байна уу?',
        onOk:()=>{ f.dataset.blOk='1'; $('#loan-form',f).requestSubmit(); } });
      return;
    }
    if(editing){
      if(newCust){ db.customers.push(newCust); cid = newCust.id; }
      Object.assign(editing, {customerId:cid, items:clean, principal:P, rate:R, termDays:N, startDate:S, note, method});
      const iss = editing.events.find(ev=>ev.type==='issue'); if(iss) iss.date = S;
      closeModal(m); changed(); toast('Өөрчлөлтийг хадгаллаа');
      return;
    }
    // Тасалбарын дугаарыг сервер олгоно, ингэснээр хоёр компьютер нэг дугаар өгөхгүй
    const btn = f.querySelector('.m-foot .btn-primary'); f.dataset.busy = '1'; btn.disabled = true;
    let no;
    try{ no = (await api('/api/ticket', {method:'POST'})).ticketNo; }
    catch(err){ delete f.dataset.busy; btn.disabled = false; handleApiError(err,false); if(err.status!==401) toast('Тасалбарын дугаар авч чадсангүй. Интернэтээ шалгаад дахин оролдоно уу.','err',5000); return; }
    const by = me ? me.username : '';
    if(newCust){ db.customers.push(newCust); cid = newCust.id; }
    const loan = { id:uid(), ticketNo:no, customerId:cid, items:clean, principal:P, rate:R, termDays:N, startDate:S, status:'active', closedDate:null, note, method, by,
      createdAt:new Date().toISOString(), events:[{id:uid(), type:'issue', date:S, at:stamp(), by}] };
    db.loans.push(loan); db.settings.nextTicket = no+1;
    closeModal(m); changed(); openLoan(loan.id);
    toast((newCust ? fullName(newCust)+' шинээр бүртгэгдэж, ' : '')+tno(loan)+' тасалбар бичигдлээ. Тасалбараа хэвлэж болно.', '', newCust?5000:undefined);
  });
}

/* ================= Төлөлт ================= */
function openPayment(id){
  const l = loanById(id); if(!l) return;
  const T = todayISO();
  const body = '<form id="pay-form" class="form" novalidate>'+
    '<div class="calc plain" id="pf-now"></div>'+
    '<div class="grid2"><div class="field"><label for="pf-date" class="req">Огноо</label><input type="date" id="pf-date" value="'+T+'"></div>'+
    '<div class="field"><label for="pf-amt" class="req">Төлсөн дүн, ₮</label><input type="text" inputmode="numeric" class="money" id="pf-amt" placeholder="0" autofocus>'+
      '<div class="quick" id="pf-quick"></div></div></div>'+
    '<div class="calc" id="pf-prev"></div>'+
    '<label class="check"><input type="checkbox" id="pf-close"><span>Энэ төлөлтөөр зээлийг хааж, барьцааг буцаан олгох</span></label>'+
    '<div class="grid2">'+'<div class="field"><label for="pf-method">Төлбөрийн хэлбэр</label><select id="pf-method"><option value="cash">Бэлэн</option><option value="bank">Данс</option></select></div>'+'<div class="field"><label for="pf-note">Тэмдэглэл</label><input type="text" id="pf-note"></div></div>'+
    '<p class="hint">Төлбөр эхлээд хуримтлагдсан хүүнд, үлдсэн нь үндсэн зээлд орно.</p>'+
  '</form>';
  const m = openModal({ title:tno(l)+': төлөлт бүртгэх', body,
    foot:'<button class="btn" data-dismiss>Болих</button><button class="btn btn-primary" type="submit" form="pay-form">Төлөлт бүртгэх</button>' });
  const f=m.el; bindMoney(f);
  const dt=$('#pf-date',f), amt=$('#pf-amt',f), cl=$('#pf-close',f);
  let userTouchedClose=false;
  cl.addEventListener('change', ()=>{ userTouchedClose=true; });
  function upd(){
    const D = isISO(dt.value) ? dt.value : T;
    const x = calc(l, D);
    $('#pf-now',f).innerHTML = '<div><span>Үндсэн үлдэгдэл</span><b>'+money(x.bal)+'</b></div><div><span>Хуримтлагдсан хүү</span><b>'+money(x.acc)+'</b></div><div class="total"><span>'+fmtDate(D)+'-ны байдлаар нийт өр</span><b>'+money(x.owed)+'</b></div>';
    $('#pf-quick',f).innerHTML = (x.acc?'<button type="button" data-v="'+x.acc+'">Зөвхөн хүү '+money(x.acc)+'</button>':'')+'<button type="button" data-v="'+x.owed+'">Бүтэн '+money(x.owed)+'</button>';
    $$('#pf-quick button',f).forEach(b=>b.addEventListener('click', ()=>{ amt.value=num(b.dataset.v); upd(); }));
    const A = parseMoney(amt.value);
    const ti=Math.min(A,x.acc), tp=Math.min(A-ti,x.bal), ov=A-ti-tp, rem=x.owed-ti-tp;
    $('#pf-prev',f).innerHTML = '<div><span>Хүүнд</span><b>'+money(ti)+'</b></div><div><span>Үндсэн зээлд</span><b>'+money(tp)+'</b></div>'+
      (ov>0?'<div><span>Илүү төлөлт</span><b>'+money(ov)+'</b></div>':'')+
      '<div class="total"><span>Төлөлтийн дараах өр</span><b>'+money(rem)+'</b></div>';
    if(!userTouchedClose) cl.checked = A>0 && A>=x.owed;
  }
  dt.addEventListener('input', upd); amt.addEventListener('input', upd); upd();
  $('#pay-form',f).addEventListener('submit', e=>{
    e.preventDefault();
    const D=dt.value, A=parseMoney(amt.value);
    if(!isISO(D)) return fieldErr(dt,'Огноог оруулна уу');
    if(D<l.startDate) return fieldErr(dt,'Огноо зээл олгосноос өмнө байж болохгүй');
    if(!(A>0)) return fieldErr(amt,'Төлсөн дүнг оруулна уу');
    opPay(l, D, A, $('#pf-note',f).value.trim(), $('#pf-method',f).value);
    if(cl.checked) opClose(l, D, 'redeem', '');
    closeModal(m); changed();
    toast(cl.checked ? tno(l)+' зээл хаагдлаа. Барьцааг буцаан олгоно уу.' : 'Төлөлт '+money(A)+' бүртгэгдлээ');
  });
}

    let saved;
    if(c){ Object.assign(c,data); saved=c; }
    else { saved = Object.assign({id:uid(), createdAt:new Date().toISOString(), by:me?me.username:''}, data); db.customers.push(saved); }
    closeModal(m); changed();
    toast(c ? 'Харилцагчийн мэдээллийг хадгаллаа' : fullName(saved)+' бүртгэгдлээ');
    if(opts.onSaved) opts.onSaved(saved);
  });
}
function customerDetail(id){
  const c = custById(id); if(!c) return null;
  const T = todayISO();
  const rows = db.loans.filter(l=>l.customerId===id).map(l=>({l, x:calc(l,T)}))
    .sort((a,b)=>(a.l.status==='active'?0:1)-(b.l.status==='active'?0:1) || b.l.startDate.localeCompare(a.l.startDate));
  const act = rows.filter(r=>r.l.status==='active'), owed = act.reduce((s,r)=>s+r.x.owed,0);
  const figs = [
    ['Регистр', esc(c.regNo||'—')], ['Утас', esc(c.phone||'—')], ['Нэмэлт утас', esc(c.phone2||'—')],
    ['Идэвхтэй зээл', act.length+' <small>/ нийт '+rows.length+'</small>'], ['Одоогийн нийт өр', money(owed)], ['Бүртгэсэн', c.createdAt?fmtDate(c.createdAt.slice(0,10)):'—']
  ];
  const bl = blacklistHit(c.regNo);
  let h = (bl ? '<div class="bl-warn" style="margin-bottom:14px"><b>Хар жагсаалтад бүртгэлтэй:</b> '+esc(bl.category)+(bl.note?'. '+esc(bl.note):'')+'</div>' : '')+
    '<dl class="figs">'+figs.map(f=>'<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>').join('')+'</dl>';
  if(c.address) h += '<p style="margin:-10px 0 16px"><span class="muted">Хаяг: </span>'+esc(c.address)+'</p>';
  if(c.note) h += '<div class="note-box">'+esc(c.note)+'</div>';
  h += '<div class="actions" style="margin-top:0"><button class="btn btn-primary" data-act="new-loan" data-cust="'+c.id+'">'+ic('plus')+'Шинэ зээл бичих</button>'+
    '<button class="btn" data-act="edit-customer" data-id="'+c.id+'">'+ic('edit')+'Засах</button>'+
    (bl?'':'<button class="btn btn-ghost" data-act="bl-add-cust" data-id="'+c.id+'">'+ic('alert')+'Хар жагсаалтад нэмэх</button>')+
    (isAdmin()?'<button class="btn btn-ghost danger" data-act="del-customer" data-id="'+c.id+'">'+ic('trash')+'Устгах</button>':'')+'</div>';
  h += '<h3 class="mini-title">Зээлийн түүх</h3>';
  if(rows.length){
    h += '<div class="panel">'+rows.map((r,i)=>'<button class="mrow" data-act="open-loan" data-id="'+r.l.id+'"'+(i===0?' style="border-top:0"':'')+'>'+
      '<span class="tno-s">'+tno(r.l)+'</span>'+
      '<span><span class="ell">'+esc(itemLine(r.l))+'</span><span class="cell-sub">'+fmtDate(r.l.startDate)+' олгосон, '+money(r.l.principal)+'</span></span>'+
      '<span class="r num">'+(r.l.status==='active'?'<b>'+money(r.x.owed)+'</b>':'')+'</span>'+badge(r.x.state)+'</button>').join('')+'</div>';
  } else h += '<div class="panel"><div class="empty"><p>Энэ харилцагчид зээл бичигдээгүй байна.</p></div></div>';
  return { title: fullName(c), body:h };
}
function openCustomer(id){
  const d = customerDetail(id); if(!d) return;
  const m = openModal({title:d.title, body:d.body, wide:true, dismissOutside:true});
  m.refresh = ()=>{ const d2=customerDetail(id); if(!d2) return false; m.el.querySelector('.m-head h2').textContent=d2.title; m.el.querySelector('.m-body').innerHTML=d2.body; return true; };
}

/* ================= Хэвлэх ================= */
function printLoan(id){
  const l = loanById(id); if(!l) return;
  const c = custById(l.customerId) || {}, s = db.settings, est = estTotal(l);
  const due = dueOf(l);
  const atDue = l.status==='active' ? calc(l, due).owed : calc(l).owed;
  const termInt = Math.round((+l.principal||0)*(+l.rate||0)/100/30*(+l.termDays||0));
  const row = (k,v,full)=>'<div'+(full?' class="full"':'')+'><span>'+k+'</span><b>'+v+'</b></div>';
  const copy = label=>'<div class="pt">'+
    '<div class="pt-head"><div><strong>'+esc(s.shopName)+'</strong><span>'+esc([s.address,s.phone].filter(Boolean).join(', '))+'</span></div><div class="pt-no"><small>Барьцааны тасалбар</small>'+tno(l)+'</div></div>'+
    '<div class="pt-grid">'+
      row('Зээлдэгч', esc(fullName(c)))+row('Регистр', esc(c.regNo||''))+
      row('Утас', esc([c.phone,c.phone2].filter(Boolean).join(', ')))+row('Олгосон огноо', fmtDate(l.startDate))+
      row('Барьцаа', (l.items||[]).map(i=>esc(catOf(i.category).name+': '+itemText(i))+(i.serial?', '+esc(i.serial):'')+(i.est&&(l.items||[]).length>1?' ('+money(i.est)+')':'')).join('<br>'), true)+
      row('Үнэлгээ', est?money(est):'')+row('Зээлийн дүн', money(l.principal))+
      row('Сарын хүү', fmtRate(l.rate)+'%')+row('Хугацаа', l.termDays+' хоног')+
      row('Хугацааны хүү', money(termInt))+row('Дуусах огноо', fmtDate(due))+
      row('Дуусах өдөр төлөх нийт дүн', money(atDue), true)+
    '</div>'+
    (s.terms?'<p class="pt-terms">'+esc(s.terms)+'</p>':'')+
    '<div class="pt-sign"><span>Зээлдэгч: ____________________</span><span>Ажилтан: ____________________</span></div>'+
    '<div class="pt-copy">'+label+'</div></div>';
  $('#print-area').innerHTML = copy('Харилцагчийн хувь') + '<div class="pt-cut"><span>энд хайчилна</span></div>' + copy('Ломбардын хувь');
  try{ window.print(); }catch(e){ toast('Хэвлэх боломжгүй байна','err'); }
}

/* ================= Нөөц, экспорт ================= */
function exportJSON(){
  const T = todayISO();
  const ok = download('lombard-nuots-'+T+'.json', JSON.stringify(db,null,2), 'application/json');
  if(ok){ try{ localStorage.setItem(BACKUP_KEY, new Date().toISOString()); }catch(e){} render(); refreshModals(); toast('Нөөц файл татагдлаа'); }
}
function exportCSV(){
  const T=todayISO();
  const head=['Тасалбар','Төлөв','Харилцагч','РД','Утас','Барьцааны төрөл','Барьцаа','Сериал','Үнэлгээ','Зээлийн дүн','Сарын хүү %','Олгосон','Дуусах','Хаагдсан','Үндсэн үлдэгдэл','Хуримтлагдсан хүү','Нийт өр','Төлсөн хүү','Нийт төлсөн'];
  const q = v=>{ v=String(v==null?'':v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const lines=[head.map(q).join(',')];
  db.loans.slice().sort((a,b)=>a.ticketNo-b.ticketNo).forEach(l=>{
    const c=custById(l.customerId)||{}, x=calc(l,T);
    lines.push([tno(l), STATE[x.state][0], fullName(c), c.regNo, c.phone, [...new Set((l.items||[]).map(i=>catOf(i.category).name))].join(', '), itemLine(l), (l.items||[]).map(i=>i.serial).filter(Boolean).join(', '), estTotal(l)||'', l.principal, l.rate, l.startDate, x.due, l.closedDate||'', x.bal, x.acc, x.owed, x.intPaid, x.paid].map(q).join(','));
  });
  if(download('lombard-zeel-'+T+'.csv', '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8')) toast('Жагсаалт татагдлаа');
}
$('#import-file').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0]; e.target.value='';
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let data;
    try{ data = JSON.parse(rd.result); }catch(err){ toast('Файл уншигдсангүй. Энэ хуудаснаас татсан .json нөөц файл сонгоно уу.','err',5000); return; }
    if(!data || !Array.isArray(data.loans) || !Array.isArray(data.customers)){ toast('Энэ файл ломбардын нөөц биш байна','err',5000); return; }
    confirmBox({ title:'Нөөцөөс сэргээх үү?', danger:true, ok:'Сэргээх',
      text:'Файлд '+data.customers.length+' харилцагч, '+data.loans.length+' зээл байна. Сервер дээрх одоогийн бүх бүртгэл ('+db.customers.length+' харилцагч, '+db.loans.length+' зээл) файлынхаар солигдож, бүх төхөөрөмжид шинэчлэгдэнэ.',
      onOk: async ()=>{ try{ await runImport(data); toast('Нөөцөөс сэргээлээ'); }catch(err){ handleApiError(err,false); toast('Сэргээж чадсангүй. Дахин оролдоно уу.','err',5000); } } });
  };
  rd.onerror = ()=>toast('Файл уншигдсангүй','err');
  rd.readAsText(file);
});

/* ================= Жишээ өгөгдөл ================= */

  const T=todayISO(), D=n=>addDays(T,n);
  const ppl=[['Батсүх','Энхжин','УП95031512','9911 2233','СХД, 32-р хороо'],['Дорж','Тэмүүлэн','ЧЕ88120433','8805 4471','БЗД, 14-р хороо'],['Цэрэндорж','Номин','УЗ01250718','9518 0062','ХУД, 3-р хороо'],['Ганбаатар','Мөнх-Эрдэнэ','ИЮ92070921','9907 3315','СБД, 8-р хороо'],['Отгонбаяр','Сарангэрэл','ФА85111206','8611 9024','ЧД, 5-р хороо'],['Пүрэвдорж','Билгүүн','УЕ99041530','9440 2718','БГД, 20-р хороо']];

/* ================= Товчлуурын үйлдлүүд ================= */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'new-loan': openLoanForm({customerId:b.dataset.cust}); break;
    case 'open-loan': openLoan(id); break;
    case 'new-customer': openCustomerForm({}); break;
    case 'open-customer': openCustomer(id); break;
    case 'edit-customer': openCustomerForm({id}); break;
    case 'del-customer': {
      const c=custById(id), n=db.loans.filter(l=>l.customerId===id).length;
      if(n){ toast('Энэ харилцагчид '+n+' зээл бүртгэлтэй тул устгах боломжгүй','err',4000); break; }
      confirmBox({title:'Харилцагчийг устгах уу?', text:esc(fullName(c))+' харилцагчийн мэдээлэл устна.', ok:'Устгах', danger:true,
        onOk:()=>{ db.customers=db.customers.filter(x=>x.id!==id); changed(); toast('Харилцагчийг устгалаа'); }});
      break; }
    case 'ltab': ui.loan.tab=b.dataset.f; ui.loan.page=1; renderLoanList(); break;
    case 'ltab-go': ui.loan.tab=b.dataset.f; ui.loan.page=1; break;
    case 'sort': {
      const u = {loan:ui.loan, txn:ui.txn}[b.dataset.k]; if(!u) break;
      if(u.sort===b.dataset.s) u.dir = u.dir==='asc'?'desc':'asc'; else { u.sort=b.dataset.s; u.dir = ['name','cat','phone','user'].includes(b.dataset.s)?'asc':'desc'; }
      ({loan:renderLoanList, txn:renderTxnList})[b.dataset.k](); break; }
    case 'pg': {
      const u = {loan:ui.loan, txn:ui.txn, bl:ui.bl, audit:ui.audit}[b.dataset.k]; if(!u) break;
      u.page = Math.max(1, +b.dataset.p||1);
      ({loan:renderLoanList, txn:renderTxnList, bl:renderBlList, audit:loadAudit})[b.dataset.k]();
      const top = $('#view .panel'); if(top) top.scrollIntoView({block:'nearest'});
      break; }
    case 'menu': openMenu(); break;
    case 'export-loans': exportLoans(); break;
    case 'export-txns': exportTxns(); break;
    case 'export-bl': exportBl(); break;
    case 'export-report': exportReport(); break;
    case 'export-audit': exportAudit(); break;
    case 'new-txn': openTxnForm({type: ui.txn.type!=='all' ? ui.txn.type : 'expense'}); break;
    case 'open-txn': openTxnForm({id}); break;
    case 'txn-tab': ui.txn.type=b.dataset.f; ui.txn.page=1; render(); break;
    case 'del-txn': {
      const t = db.txns.find(x=>x.id===id); if(!t) break;
      confirmBox({title:'Гүйлгээг устгах уу?', text:esc(TXN_T[t.type]+': '+(t.category||'')+' '+money(t.amount)+' ('+fmtDate(t.date)+')')+' устна.', ok:'Устгах', danger:true,
        onOk:()=>{ db.txns = db.txns.filter(x=>x.id!==id); closeAllModals(); changed(); toast('Гүйлгээг устгалаа'); }});
      break; }
    case 'new-bl': openBlForm({}); break;
    case 'open-bl': openBlForm({id}); break;
    case 'bl-add-cust': { const c=custById(id); if(c) openBlForm({regNo:c.regNo, name:fullName(c)}); break; }
    case 'del-bl': {
      const x = db.blacklist.find(v=>v.id===id); if(!x) break;
      confirmBox({title:'Хар жагсаалтаас устгах уу?', text:esc(x.regNo)+' бүртгэл бүрмөсөн устна. Түр хасах бол төлөвийг "Идэвхгүй" болгоно уу.', ok:'Устгах', danger:true,
        onOk:()=>{ db.blacklist = db.blacklist.filter(v=>v.id!==id); closeAllModals(); changed(); toast('Устгалаа'); }});
      break; }
    case 'cash-day': { const d=+b.dataset.d; ui.cashDay = d ? addDays(isISO(ui.cashDay)?ui.cashDay:todayISO(), d) : todayISO(); render(); break; }
    case 'set-opening': openOpening(); break;
    case 'rep-preset': ui.rep.preset=b.dataset.f; if(b.dataset.f==='custom'){ const r=repRange(); ui.rep.from=r[0]; ui.rep.to=r[1]; } render(); break;
    case 'new-user': openUserForm(null); break;
    case 'open-user': { const u = userCache.find(x=>x.id===id); if(u) openUserForm(u); break; }
    case 'pay': openPayment(id); break;
    case 'extend': openExtend(id); break;
    case 'redeem': openRedeem(id); break;
    case 'forfeit': openForfeit(id); break;
    case 'print': printLoan(id); break;
    case 'edit-loan': openLoanForm({id}); break;
    case 'reopen': {
      const l=loanById(id);
      confirmBox({title:tno(l)+' зээлийг дахин нээх үү?', text:'Зээл идэвхтэй төлөвт буцна. Хаах үед бүртгэсэн төлөлт түүхэнд хэвээр үлдэх тул шаардлагатай бол тусад нь устгана уу.', ok:'Дахин нээх',
        onOk:()=>{ opReopen(l); changed(); toast(tno(l)+' зээлийг дахин нээлээ'); }});
      break; }
    case 'del-loan': {
      const l=loanById(id);
      confirmBox({title:tno(l)+' тасалбарыг устгах уу?', text:'Энэ зээлийн бүх төлөлт, сунгалтын түүх хамт устна. Алдаатай бичсэн тасалбарыг л устгана уу.', ok:'Устгах', danger:true,
        onOk:()=>{ db.loans=db.loans.filter(x=>x.id!==id); changed(); toast(tno(l)+' тасалбарыг устгалаа'); }});
      break; }
    case 'del-event': {
      const l=loanById(id), ev=l&&l.events.find(x=>x.id===b.dataset.ev); if(!ev) break;
      confirmBox({title:'Бичлэгийг устгах уу?', text:(ev.type==='payment'?'Төлөлт '+money(ev.amount):'Сунгалт')+' ('+fmtDate(ev.date)+') устаж, үлдэгдэл дахин бодогдоно.', ok:'Устгах', danger:true,
        onOk:()=>{ l.events=l.events.filter(x=>x.id!==ev.id); changed(); toast('Бичлэгийг устгалаа'); }});
      break; }
    case 'demo': loadDemo(); break;
    case 'backup': exportJSON(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#import-file').click(); break;
    case 'wipe':
      confirmBox({title:'Бүх өгөгдлийг устгах уу?', text:'Харилцагч, зээл, төлөлтийн бүх бүртгэл устна. Үүнийг буцаах боломжгүй.', ok:'Бүгдийг устгах', danger:true, typed:'УСТГАХ',
        onOk: async ()=>{
          syncing = true;
          try{ await api('/api/wipe', {method:'POST'}); applyServer(await api('/api/data')); syncing = false; render(); setSync('ok'); toast('Бүх бүртгэл устлаа'); }
          catch(err){ syncing = false; handleApiError(err,false); toast('Устгаж чадсангүй. Дахин оролдоно уу.','err'); }
        }});
      break;
    case 'logout': logout(); break;
    case 'retry-sync': pushSync(); break;
    case 'sms-test': smsTest(b); break;
    case 'sms-run': smsRun(b); break;
  }
});

render();
boot();
})();
